<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SocialPulse</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Icons -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>


<div class="container">


    <div class="hero">

        <h1>
            <i class="fa-solid fa-chart-line"></i>

            SocialPulse
        </h1>

        <p>

            Multi Platform Sentiment Analyzer

        </p>

    </div>



    <div class="card main-card shadow-lg">

        <div class="card-body">


            <h3 class="mb-4">

                Analyze YouTube or Reddit

            </h3>


            {% if error %}

            <div class="alert alert-danger">

                {{ error }}

            </div>

            {% endif %}


            <form
                action="/analyze"
                method="POST"
            >

                <label class="form-label">

                    Paste URL

                </label>

                <input

                    type="text"

                    class="form-control form-control-lg"

                    placeholder="Paste YouTube or Reddit URL"

                    name="url"

                    required

                >

                <br>

                <button
                    class="btn btn-primary btn-lg w-100"
                    id="analyzeBtn"
                >

                    <i class="fa-solid fa-magnifying-glass-chart"></i>

                    Analyze

                </button>

            </form>

        </div>

    </div>



    <div class="features">

        <div class="row mt-5">


            <div class="col-md-4">

                <div class="feature-card">

                    <i class="fa-brands fa-youtube"></i>

                    <h4>YouTube</h4>

                    <p>

                        Analyze video comments and audience sentiment.

                    </p>

                </div>

            </div>


            <div class="col-md-4">

                <div class="feature-card">

                    <i class="fa-brands fa-reddit"></i>

                    <h4>Reddit</h4>

                    <p>

                        Analyze Reddit discussions and public opinion.

                    </p>

                </div>

            </div>


            <div class="col-md-4">

                <div class="feature-card">

                    <i class="fa-solid fa-brain"></i>

                    <h4>AI Sentiment</h4>

                    <p>

                        Positive, Neutral and Negative classification.

                    </p>

                </div>

            </div>


        </div>

    </div>

</div>


<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
